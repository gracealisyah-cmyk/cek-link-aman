name: Build APK Cek Link Aman
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Buat Project
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/grace/ceklink
          mkdir -p app/src/main/assets
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle
          echo "plugins { id 'com.android.application' } android { compileSdk 34; namespace 'com.grace.ceklink'; defaultConfig { applicationId 'com.grace.ceklink'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' } }" > app/build.gradle
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Cek Link Aman"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.grace.ceklink; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.loadUrl("file:///android_asset/index.html"); setContentView(w);} }' > app/src/main/java/com/grace/ceklink/MainActivity.java
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Link Aman</title><style>body{font-family:sans-serif;background:#e8f5e9;padding:20px}.box{background:white;padding:20px;border-radius:15px}input{width:100%;padding:15px;border-radius:10px;border:2px solid #ddd}button{width:100%;padding:15px;background:#25D366;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:10px}.result{margin-top:20px;padding:15px;border-radius:10px;display:none;font-weight:bold}.aman{background:#d4edda;color:#155724}.waspada{background:#fff3cd;color:#856404}.bahaya{background:#f8d7da;color:#721c24}</style></head><body><div class="box"><h2>🔒 Cek Link Aman</h2><input id="linkInput" placeholder="Paste link WA"><button onclick="cek()">CEK SEKARANG</button><div id="hasil" class="result"></div><div id="detail" style="margin-top:10px"></div></div><script>function cek(){let url=document.getElementById("linkInput").value.trim();if(!url)return alert("Isi link");if(!url.startsWith("http"))url="https://"+url;let level="aman",alasan=[];try{let host=new URL(url).hostname.toLowerCase();if(/^\d+\.\d+\.\d+\.\d+$/.test(host)){level="bahaya";alasan.push("❌ IP Address - 99% tipu")}if(host.includes("trycloudflare.com")||host.includes("ngrok.io")){level="bahaya";alasan.push("❌ Link sementara trycloudflare")}if(["bit.ly","s.id","tinyurl","cutt.ly"].some(s=>host.includes(s))){if(level!="bahaya")level="waspada";alasan.push("⚠️ Link pendek")}if(host.includes("sh0pee")||host.includes("dana-kaget")){level="bahaya";alasan.push("❌ Brand palsu")}if(host.endsWith(".xyz")||host.endsWith(".tk")){if(level!="bahaya")level="waspada";alasan.push("⚠️ Domain gratisan")}if(level=="aman")alasan.push("✅ Aman")}catch(e){level="bahaya";alasan.push("❌ Format aneh")}let h=document.getElementById("hasil");h.style.display="block";h.className="result "+level;h.innerHTML=level=="aman"?"✅ AMAN":level=="waspada"?"⚠️ WASPADA":"❌ BAHAYA";document.getElementById("detail").innerHTML=alasan.join("<br>")}</script></body></html>' > app/src/main/assets/index.html
      - name: Build APK
        run: |
          cd app
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CekLinkAman-APK
          path: app/build/outputs/apk/debug/app-debug.apk
